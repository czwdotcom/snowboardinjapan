name: Build and deploy

# Every deploy pulls fresh run/lift/food data from OpenStreetMap, then publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0' # weekly refresh, Monday 03:17 Singapore time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch resort data from OpenStreetMap
        run: node scripts/fetch-osm.mjs || echo "::warning::OpenStreetMap fetch failed; deploying with the existing data file (if any)."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
